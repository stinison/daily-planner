<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Daily Planner</title>
        <link rel="stylesheet" href="style.css">
        <link rel="manifest" href="manifest.json">
        <link rel="apple-touch-icon" href="icon.png">

        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
    </head>

    <body>
        <header>
            <p id="date"></p>
        </header>

        <main>
            <input id="taskInput" type="text" placeholder="Ange aktivitet...">
            <input id="taskDate" type="date">
            <select id="taskRepeat">
                <option value="none">En gång</option>
                <option value="daily">Varje dag</option>
            </select>
            <button id="newTask">
                + Ny Aktivitet
            </button>
            <button id="clearTasks">
                Rensa alla aktiviteter
            </button>
            <div id="todoList"></div>
        </main>

        <div id="editModal" class="modal">

            <div class="modalContent">

                <h2>Redigera aktivitet</h2>

                <label for="editTaskInput">Aktivitet</label>
                <input id="editTaskInput" type="text" placeholder="Ange aktivitet...">
                
                <label for="editTaskDate">Datum</label>
                <input id="editTaskDate" type="date">
                
                <label for="editTaskRepeat">Upprepning</label>
                <select id="editTaskRepeat">

                    <option value="none">
                        En gång
                    </option>
                    <option value="daily">
                        Varje dag
                    </option>

                </select>

                <div id="editScope" class="editScope">

                    <label>Vad vill du ändra?</label>

                    <select id="editScopeSelect">

                        <option value="single">
                            Bara denna dag
                        </option>

                        <option value="series">
                            Hela serien
                        </option>

                    </select>

                </div>

                <div class="modalButtons">

                    <button id="cancelEdit">Avbryt</button>
                    <button id="saveEdit">Spara</button>

                </div>

            </div>

        </div>

        <script src="app.js"></script>

    </body>
</html>
